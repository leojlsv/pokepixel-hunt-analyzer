name: Apply Mobile M3 Integration

on:
  push:
    branches:
      - feature/mobile-version
    paths:
      - .github/workflows/mobile-m3-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mobile-version
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Integrate M3 renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current = Path('userscript/current-view.js')
          text = current.read_text()

          old_import = 'import { latestSpeciesEncounter } from "./hunt-view-model.js";\n'
          new_import = old_import + 'import { createMobileEncounterRenderer } from "./mobile-encounter-renderer.js";\n'
          if new_import not in text:
              assert old_import in text
              text = text.replace(old_import, new_import, 1)

          old_lists = '''  const lists = {
            captured: createListState("captured"),
            failed: createListState("failed")
          };

          bindListControls("captured");'''
          new_lists = '''  const lists = {
            captured: createListState("captured"),
            failed: createListState("failed")
          };
          const mobileEncounterRenderer = shadow.host?.dataset.uiMode === "mobile"
            ? createMobileEncounterRenderer(shadow, {
                onSort(prefix, sort) {
                  lists[prefix].sort = sort;
                  updateSortIndicators(prefix);
                  rebuildEncounterList(prefix, { resetScroll: false });
                },
                onNeedMore(prefix) {
                  appendEncounterBatch(prefix);
                },
                onToggleCaptured(encounterId) {
                  toggleEncounterDetail("captured", encounterId);
                }
              })
            : null;

          bindListControls("captured");'''
          if 'const mobileEncounterRenderer =' not in text:
              assert old_lists in text
              text = text.replace(old_lists, new_lists, 1)

          marker = '  function updateSortIndicators(prefix) {'
          helper = '''  function renderMobileEncounterList(prefix) {
            if (!mobileEncounterRenderer) return;
            const state = lists[prefix];
            mobileEncounterRenderer.render(
              prefix,
              state.visible.slice(0, state.renderedCount),
              {
                expandedIds: state.expandedIds,
                currentHuntStartedAtMs,
                sort: state.sort
              }
            );
          }

'''
          if helper not in text:
              assert marker in text
              text = text.replace(marker, helper + marker, 1)

          old_sort_end = '''    for (const header of shadow.querySelectorAll(`[data-encounter-sort="${prefix}"]`)) {
              const indicator = header.querySelector("[data-sort-indicator]");
              if (!indicator) continue;
              indicator.textContent = header.dataset.sortKey === state.sort.key
                ? state.sort.direction === "desc" ? "▼" : "▲"
                : "";
            }
          }

          function rebuildEncounterList'''
          new_sort_end = '''    for (const header of shadow.querySelectorAll(`[data-encounter-sort="${prefix}"]`)) {
              const indicator = header.querySelector("[data-sort-indicator]");
              if (!indicator) continue;
              indicator.textContent = header.dataset.sortKey === state.sort.key
                ? state.sort.direction === "desc" ? "▼" : "▲"
                : "";
            }
            mobileEncounterRenderer?.syncSort(prefix, state.sort);
          }

          function rebuildEncounterList'''
          if 'mobileEncounterRenderer?.syncSort(prefix, state.sort);' not in text:
              assert old_sort_end in text
              text = text.replace(old_sort_end, new_sort_end, 1)

          old_clear = '''    body.replaceChildren();
            if (resetScroll && tableWrap) tableWrap.scrollTop = 0;'''
          new_clear = '''    body.replaceChildren();
            renderMobileEncounterList(prefix);
            if (resetScroll && tableWrap) tableWrap.scrollTop = 0;'''
          if new_clear not in text:
              assert old_clear in text
              text = text.replace(old_clear, new_clear, 1)

          old_batch = '''      body.appendChild(fragment);
              state.renderedCount = end;
              state.rendering = false;'''
          new_batch = '''      body.appendChild(fragment);
              state.renderedCount = end;
              state.rendering = false;
              renderMobileEncounterList(prefix);'''
          if new_batch not in text:
              assert old_batch in text
              text = text.replace(old_batch, new_batch, 1)

          old_upsert = '''    state.renderedCount = desiredRenderedCount;
          }

          function createEncounterRow'''
          new_upsert = '''    state.renderedCount = desiredRenderedCount;
            renderMobileEncounterList(prefix);
          }

          function createEncounterRow'''
          if new_upsert not in text:
              assert old_upsert in text
              text = text.replace(old_upsert, new_upsert, 1)

          old_collapse = '''      rowState.detail = null;
              rowState.main.setAttribute("aria-expanded", "false");
              return;'''
          new_collapse = '''      rowState.detail = null;
              rowState.main.setAttribute("aria-expanded", "false");
              renderMobileEncounterList(prefix);
              return;'''
          if new_collapse not in text:
              assert old_collapse in text
              text = text.replace(old_collapse, new_collapse, 1)

          old_expand = '''    rowState.main.setAttribute("aria-expanded", "true");
            rowState.main.after(detail);
          }

          function updateCount'''
          new_expand = '''    rowState.main.setAttribute("aria-expanded", "true");
            rowState.main.after(detail);
            renderMobileEncounterList(prefix);
          }

          function updateCount'''
          if new_expand not in text:
              assert old_expand in text
              text = text.replace(old_expand, new_expand, 1)

          current.write_text(text)

          styles = Path('userscript/mobile-styles.js')
          css = styles.read_text()
          marker = '@media (orientation: landscape) and (min-width: 640px) {'
          m3 = r'''
          :host([data-ui-mode="mobile"]) .encounter-section .filters {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 8px;
            padding: 8px;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .filters label,
          :host([data-ui-mode="mobile"]) .encounter-section .filters .filter-field {
            min-width: 0;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .filters select,
          :host([data-ui-mode="mobile"]) .encounter-section .filters input,
          :host([data-ui-mode="mobile"]) .encounter-section .rarity-multiselect summary {
            min-height: 42px;
            font-size: 11px;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .filter-field:has(.rarity-multiselect) {
            grid-column: 1 / -1;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .rarity-check-menu {
            position: static;
            width: 100%;
            max-height: none;
            margin-top: 4px;
            box-shadow: none;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .rarity-check-option {
            min-height: 38px;
          }

          :host([data-ui-mode="mobile"]) .mobile-sort-field {
            grid-column: 1 / -1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
            color: #c0ad72;
            font-size: 9px;
            letter-spacing: .025em;
            text-transform: uppercase;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .section-head {
            position: relative;
            min-height: 44px;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .section-meta {
            padding-right: 34px;
            pointer-events: none;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .collapse-button {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            min-width: 100%;
            height: 100%;
            padding: 0 10px 0 0;
            justify-content: flex-end;
            border: 0;
            background: transparent;
            pointer-events: auto;
          }

          :host([data-ui-mode="mobile"]) .encounter-section .collapse-button:active {
            background: rgba(255,255,255,.035);
          }

          :host([data-ui-mode="mobile"]) .encounter-section .table-wrap {
            display: none !important;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-list {
            width: 100%;
            min-width: 0;
            padding: 8px;
            display: grid;
            gap: 7px;
            overflow: visible;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card {
            min-width: 0;
            padding: 10px;
            display: grid;
            gap: 6px;
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            background: #272823;
            color: var(--text);
            touch-action: manipulation;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card-captured {
            cursor: pointer;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card:active {
            background: #30312c;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card:focus-visible {
            outline: 2px solid var(--gold-soft);
            outline-offset: 1px;
          }

          :host([data-ui-mode="mobile"]) .encounter-card-shiny {
            background: #383323;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card-top,
          :host([data-ui-mode="mobile"]) .mobile-encounter-card-meta,
          :host([data-ui-mode="mobile"]) .mobile-encounter-card-footer {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-name {
            min-width: 0;
            overflow: hidden;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-iv {
            flex: 0 0 auto;
            color: var(--text);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card-meta,
          :host([data-ui-mode="mobile"]) .mobile-encounter-card-footer {
            color: var(--muted);
            font-size: 10px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-card-meta > span,
          :host([data-ui-mode="mobile"]) .mobile-encounter-card-footer > span,
          :host([data-ui-mode="mobile"]) .mobile-encounter-card-footer > time {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-time {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-chevron {
            flex: 0 0 auto;
            color: var(--gold);
            font-size: 13px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-detail {
            margin-top: 3px;
            padding-top: 8px;
            display: grid;
            gap: 7px;
            border-top: 1px solid var(--border-soft);
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-iv-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 5px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-iv-grid > span {
            min-width: 0;
            padding: 5px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            border-radius: 3px;
            background: #22231f;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-iv-grid small {
            color: var(--muted);
            font-size: 8px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-iv-grid strong {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-detail-row {
            min-width: 0;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            font-size: 9px;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-detail-label {
            color: #c0ad72;
          }

          :host([data-ui-mode="mobile"]) .mobile-encounter-detail-value {
            min-width: 0;
            overflow: hidden;
            color: #c7c3b7;
            font-size: 9px;
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          '''
          if '.mobile-encounter-list {' not in css:
              assert marker in css
              css = css.replace(marker, m3 + marker, 1)
          styles.write_text(css)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: npm run validate

      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/mobile-m3-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/current-view.js userscript/mobile-styles.js .github/workflows/mobile-m3-patch.yml
          git commit -m "feat: integrate mobile encounter cards"
          git push origin HEAD:feature/mobile-version
