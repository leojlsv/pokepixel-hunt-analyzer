name: Apply Mobile M3 Integration

on:
  push:
    branches:
      - feature/mobile-version
    paths:
      - .github/workflows/mobile-m3-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/mobile-version
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply integration patch
        run: node scripts/apply-mobile-m3.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: npm run validate

      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/mobile-m3-patch.yml scripts/apply-mobile-m3.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/current-view.js userscript/mobile-styles.js .github/workflows/mobile-m3-patch.yml scripts/apply-mobile-m3.mjs
          git commit -m "feat: integrate mobile encounter cards"
          git push origin HEAD:feature/mobile-version
