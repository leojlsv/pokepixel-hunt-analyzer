name: History final polish

on:
  push:
    branches:
      - feat/history-v1.8

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message == 'chore: run history final polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/history-v1.8
          fetch-depth: 0

      - name: Apply final History UI polish
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          history = Path("userscript/history-view.js")
          text = history.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '  formatDuration,\n',
              '',
              'remove generic duration formatter'
          )

          text = replace_once(
              text,
              '\nfunction formatClock(timestamp) {',
              '''\nfunction formatHistoryDuration(milliseconds) {\n  const safeMs = Number.isFinite(milliseconds) ? Math.max(0, milliseconds) : 0;\n  const totalMinutes = Math.floor(safeMs / 60_000);\n  const hours = Math.floor(totalMinutes / 60);\n  const minutes = totalMinutes % 60;\n  return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;\n}\n\nfunction formatClock(timestamp) {''',
              'add HH:mm History duration formatter'
          )

          text = replace_once(
              text,
              '        formatDuration(bundle.metrics.activeMs),\n        formatNumber(breakdown.seen),\n        formatNumber(breakdown.captured),\n        formatNumber(breakdown.shiny.failed),\n        formatNumber(breakdown.rarities.legendary.failed),\n        formatNumber(breakdown.rarities.mythical.failed)',
              '        formatHistoryDuration(bundle.metrics.activeMs),\n        formatNumber(breakdown.seen),\n        formatNumber(breakdown.captured),\n        formatNumber(breakdown.shiny.captured),\n        formatNumber(breakdown.rarities.legendary.captured),\n        formatNumber(breakdown.rarities.mythical.captured)',
              'switch Hunt summary to captured Sh/Leg/Myt and HH:mm'
          )

          text = replace_once(
              text,
              '''      const row = document.createElement("tr");\n      const values = [\n        RARITY_SHORT.get(key),''',
              '''      const row = document.createElement("tr");\n      row.className = rarityClass(key);\n      const values = [\n        RARITY_SHORT.get(key),''',
              'color Pokemon rarity rows'
          )

          text = replace_once(
              text,
              '''      values.forEach((value, index) => {\n        const td = document.createElement("td");\n        td.textContent = value;\n        if (index === 0) td.className = rarityClass(key);\n        row.appendChild(td);\n      });''',
              '''      values.forEach((value) => {\n        const td = document.createElement("td");\n        td.textContent = value;\n        row.appendChild(td);\n      });''',
              'inherit rarity color across Pokemon detail row'
          )

          history.write_text(text, encoding="utf-8")

          markup = Path("userscript/ui-markup.js")
          text = markup.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '<th>Date</th><th>Dur.</th><th>Seen</th><th>Cap.</th><th>Sh.F</th><th>Leg.F</th><th>Myt.F</th>',
              '<th>Date</th><th>Dur.</th><th>Seen</th><th>Cap.</th><th>Sh</th><th>Leg</th><th>Myt</th>',
              'rename Hunt summary captured headers'
          )
          markup.write_text(text, encoding="utf-8")

          styles = Path("userscript/history-styles.js")
          text = styles.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''.history-pokemon-rarity-table th:nth-child(1),\n.history-pokemon-rarity-table td:nth-child(1) { width: 58px; text-align: left; }\n.history-pokemon-rarity-table th:nth-child(n+2),''',
              '''.history-pokemon-rarity-table th:nth-child(1),\n.history-pokemon-rarity-table td:nth-child(1) { width: 58px; text-align: left; }\n.history-pokemon-rarity-table th:nth-child(2),\n.history-pokemon-rarity-table td:nth-child(2) { width: 82px; }\n.history-pokemon-rarity-table tbody tr { font-weight: 650; }\n.history-pokemon-rarity-table th:nth-child(n+2),''',
              'widen Pokemon Seen column'
          )
          styles.write_text(text, encoding="utf-8")

      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/history-final-polish.yml
          git add userscript/history-view.js userscript/ui-markup.js userscript/history-styles.js
          git commit -m "refine: finalize History summary and rarity UI"
          git push origin HEAD:feat/history-v1.8
