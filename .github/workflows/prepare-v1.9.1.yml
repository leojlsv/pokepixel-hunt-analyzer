name: Prepare v1.9.1

on:
  push:
    branches:
      - hotfix/v1.9.1-zone-hunt-reset

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: hotfix/v1.9.1-zone-hunt-reset

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump package version
        run: npm version 1.9.1 --no-git-tag-version

      - name: Update release documentation
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("**Versão:** `v1.9.0`", "**Versão:** `v1.9.1`", 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "The project follows Semantic Versioning.\n\n"
          section = """## [1.9.1] - 2026-08-26\n\n### Hunt lifecycle UX\n- A confirmed encounter in a different `zoneId` now ends the previous local Hunt and starts a new one, even when the server keeps the same `serverSessionId`.\n- The first real encounter in the new zone becomes the boundary, avoiding resets from merely traversing between areas.\n- Same server session + same zone continues the current Hunt unchanged.\n- Manual Pause and End Hunt locks keep priority and still block automatic Hunt boundaries.\n\n### Validation\n- Added unit coverage for zone change => `new_hunt`.\n- Added integration coverage proving encounters are persisted into separate sessions across a zone change.\n- Manual in-game validation approved before release.\n\n"""
          if "## [1.9.1]" not in text:
              text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Validate
        run: npm run validate

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/prepare-v1.9.1.yml
          git config user.name "Leandro Vasconcelos"
          git config user.email "45770148+leojlsv@users.noreply.github.com"
          git add package.json package-lock.json README.md CHANGELOG.md .github/workflows/prepare-v1.9.1.yml
          git commit -m "chore: prepare v1.9.1 hotfix release"
          git push origin HEAD:hotfix/v1.9.1-zone-hunt-reset
