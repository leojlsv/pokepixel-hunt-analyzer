name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare v1.9.0
    if: github.event_name == 'pull_request' && github.head_ref == 'dev/huntsim-protocol-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: dev/huntsim-protocol-compat
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare release files
        run: |
          if node -e "process.exit(require('./package.json').version === '1.9.0' ? 0 : 1)"; then
            echo "v1.9.0 already prepared; no mutation required."
            exit 0
          fi
          python scripts/prepare-v1.9.0.py
          npm install --package-lock-only --ignore-scripts
          npm ci --no-audit --no-fund
          npm run audit:deps
          npm run validate
          npm run build:userscript:dev
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/build-userscript.mjs CHANGELOG.md README.md docs/ARCHITECTURE.md docs/PROTOCOL_AND_ANALYTICS.md docs/HUNTSIM_PROTOCOL_COMPATIBILITY.md docs/CAPTURE_TICKETS.md docs/DEVELOPMENT.md
          git commit -m "release: prepare PokePixel Hunt Analyzer v1.9.0"
          git push origin HEAD:dev/huntsim-protocol-compat

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Test and build
        run: npm run validate
