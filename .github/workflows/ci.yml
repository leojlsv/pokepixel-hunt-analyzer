name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test and build
        run: npm run validate

  apply-alerts-tab:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/audio-alerts'
    name: Apply Alerts Tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/audio-alerts
          fetch-depth: 0

      - name: Patch UI integration
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          p = Path('userscript/ui-markup.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function createHistoryMarkup() {'
          alerts = r'''function createAlertsMarkup() {
  const rows = [
    ["epic", "Epic", "epic"],
    ["legendary", "Legendary", "legendary"],
    ["mythical", "Mythical", "mythic"],
    ["shiny", "Shiny", "shiny"]
  ].map(([rarity, label, key]) => `
          <span class="${rarity === "shiny" ? "shiny-count" : `rarity-${rarity}`}" style="font-weight:800">${label}</span>
          <label style="display:flex;justify-content:center"><input type="checkbox" data-audio-alert="${key}_captured" aria-label="${label} captured sound alert" title="${label} captured"></label>
          <label style="display:flex;justify-content:center"><input type="checkbox" data-audio-alert="${key}_fled" aria-label="${label} fled sound alert" title="${label} fled"></label>`).join("");

  return `
    <section id="view-alerts" class="view alerts-view" hidden>
      <section class="section">
        <div class="section-head">
          <h3>Sound Alerts</h3>
          <div class="section-meta"><span id="alerts-enabled-count" class="section-badge">0/8</span></div>
        </div>
        <div style="padding:10px;display:grid;grid-template-columns:minmax(110px,1fr) 90px 90px;gap:9px 10px;align-items:center;background:var(--bg-elevated)">
          <span></span>
          <b style="color:#9e9270;font-size:9px;text-align:center;text-transform:uppercase">Captured</b>
          <b style="color:#9e9270;font-size:9px;text-align:center;text-transform:uppercase">Fled</b>
          ${rows}
        </div>
        <div style="padding:8px 10px;border-top:1px solid var(--border-soft);color:var(--muted);font-size:9px;line-height:1.35">
          Enable only the alerts you want. Enabling an option plays its sound once as preview. If a Pokémon is Shiny and also Epic/Legendary/Mythical, the enabled Shiny alert has priority.
        </div>
      </section>
    </section>`;
}

'''
          if 'function createAlertsMarkup() {' not in s:
              s = once(s, marker, alerts + marker, 'add alerts markup')
          if 'data-view="alerts"' not in s:
              s = once(
                  s,
                  '        <button data-view="history" class="tab" type="button">History</button>\n        <strong id="hunt-time" class="hunt-time">00:00</strong>',
                  '        <button data-view="history" class="tab" type="button">History</button>\n        <button data-view="alerts" class="tab" type="button">Alerts</button>\n        <strong id="hunt-time" class="hunt-time">00:00</strong>',
                  'add Alerts top tab'
              )
          if '${createAlertsMarkup()}' not in s:
              s = once(s, '      ${createHistoryMarkup()}\n    </aside>', '      ${createHistoryMarkup()}\n      ${createAlertsMarkup()}\n    </aside>', 'add Alerts view')
          p.write_text(s, encoding='utf-8')

          p = Path('userscript/ui.js')
          s = p.read_text(encoding='utf-8')
          if '  audioAlerts\n}) {' not in s:
              s = once(
                  s,
                  '  onSessionAction,\n  onLoadHistorySessions,\n  onLoadHistorySessionEncounters\n}) {',
                  '  onSessionAction,\n  onLoadHistorySessions,\n  onLoadHistorySessionEncounters,\n  audioAlerts\n}) {',
                  'accept audio alerts'
              )
          if 'audioAlerts?.bindControls(shadow);' not in s:
              s = once(
                  s,
                  '    historyView = createHistoryView(shadow, {\n      loadSessions: onLoadHistorySessions,\n      loadSessionEncounters: onLoadHistorySessionEncounters\n    });\n\n    bindUiEvents();',
                  '    historyView = createHistoryView(shadow, {\n      loadSessions: onLoadHistorySessions,\n      loadSessionEncounters: onLoadHistorySessionEncounters\n    });\n    audioAlerts?.bindControls(shadow);\n\n    bindUiEvents();',
                  'bind alert controls'
              )
          s = once(
              s,
              '    activeView = view === "history" ? "history" : "current";\n    shadow.getElementById("view-current").hidden = activeView !== "current";\n    shadow.getElementById("view-history").hidden = activeView !== "history";',
              '    activeView = ["history", "alerts"].includes(view) ? view : "current";\n    shadow.getElementById("view-current").hidden = activeView !== "current";\n    shadow.getElementById("view-history").hidden = activeView !== "history";\n    shadow.getElementById("view-alerts").hidden = activeView !== "alerts";',
              'support Alerts view'
          )
          s = once(
              s,
              '    switchView(state.view === "history" ? "history" : "current");',
              '    switchView(["history", "alerts"].includes(state.view) ? state.view : "current");',
              'restore Alerts view'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('userscript/main.js')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '      onLoadHistorySessionEncounters: (sessionId) =>\n        encountersRepository.getBySessionId(sessionId)\n    });\n    audioAlerts?.mountControls();',
              '      onLoadHistorySessionEncounters: (sessionId) =>\n        encountersRepository.getBySessionId(sessionId),\n      audioAlerts\n    });',
              'pass alerts into UI'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('userscript/audio-alerts.js')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '  return {\n    mountControls,\n    handleTerminalAlert\n  };',
              '  return {\n    bindControls,\n    handleTerminalAlert\n  };',
              'expose bindControls'
          )
          p.write_text(s, encoding='utf-8')

      - name: Validate patched tree
        run: |
          npm ci --no-audit --no-fund
          npm run validate

      - name: Commit feature and restore CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/feat/history-v1.8 -- .github/workflows/ci.yml
          git rm -f .github/workflows/alerts-tab-apply.yml .github/alerts-tab-trigger || true
          git add .github/workflows/ci.yml userscript/ui-markup.js userscript/ui.js userscript/main.js userscript/audio-alerts.js
          git commit -m "fix: move sound alerts to dedicated tab"
          git push origin HEAD:feat/audio-alerts
