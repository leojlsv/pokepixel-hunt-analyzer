name: Temporary lock refresh

on:
  pull_request:
    branches:
      - feat/custom-audio

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh esbuild lock
        run: npm install --package-lock-only --save-dev esbuild@0.28.2 --no-audit --no-fund

      - name: Record reviewed install script
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.allowScripts = { 'esbuild@0.28.2': true };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload refreshed manifests
        uses: actions/upload-artifact@v4
        with:
          name: hardened-npm-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
