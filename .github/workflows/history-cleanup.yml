name: Temporary history cleanup

on:
  push:
    branches:
      - chore/open-source-readiness

permissions:
  contents: write

jobs:
  rewrite-history:
    if: github.event.head_commit.message == 'chore: add temporary history cleanup workflow'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          ref: chore/open-source-readiness
          fetch-depth: 0
          fetch-tags: true

      - name: Remove Claude session identifiers from commit messages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --prune \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          mapfile -t remote_branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | sort
          )
          expected_branches=("chore/open-source-readiness" "main")

          if [[ "${remote_branches[*]}" != "${expected_branches[*]}" ]]; then
            echo "::error::Unexpected remote branches: ${remote_branches[*]}"
            exit 1
          fi

          changed_files=$(git diff --name-only HEAD^1 HEAD)
          if [[ "$changed_files" != ".github/workflows/history-cleanup.yml" ]]; then
            echo "::error::Trigger commit changed unexpected files: $changed_files"
            exit 1
          fi

          match_count=$(git log --all --format='%B' | grep -c '^Claude-Session:' || true)
          if [[ "$match_count" -ne 6 ]]; then
            echo "::error::Expected exactly 6 Claude-Session lines, found $match_count"
            exit 1
          fi

          echo "Found exactly 6 Claude-Session lines."
          echo "Tags before rewrite:"
          git tag --list | sort || true

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            kind=$(git cat-file -t "refs/tags/$tag")
            echo "  $tag ($kind)"
            if [[ "$kind" == "tag" ]] && git cat-file -p "refs/tags/$tag" | grep -q '^gpgsig '; then
              echo "::error::Signed annotated tag detected: $tag"
              exit 1
            fi
          done < <(git tag --list | sort)

          # Confirm that the workflow token can write before doing any rewrite.
          permission_test_branch="__history_cleanup_permission_test"
          git push origin "HEAD:refs/heads/$permission_test_branch"
          git push origin --delete "$permission_test_branch"

          workflow_head=$(git rev-parse HEAD)
          main_tree_before=$(git rev-parse 'origin/main^{tree}')
          workflow_tree_before=$(git rev-parse 'HEAD^{tree}')
          readiness_target_tree=$(git rev-parse 'HEAD^1^{tree}')

          git switch --detach
          git branch -f main origin/main
          git branch -f chore/open-source-readiness "$workflow_head"

          refs=(main chore/open-source-readiness)
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            refs+=("refs/tags/$tag")
          done < <(git tag --list | sort)

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --msg-filter 'sed "/^Claude-Session:[[:space:]]*/d"' \
            --tag-name-filter cat \
            -- "${refs[@]}"

          if git log "${refs[@]}" --format='%B' | grep -q '^Claude-Session:'; then
            echo "::error::Claude-Session line still reachable after rewrite"
            exit 1
          fi

          if [[ "$(git rev-parse 'main^{tree}')" != "$main_tree_before" ]]; then
            echo "::error::main tree changed during message-only rewrite"
            exit 1
          fi

          if [[ "$(git rev-parse 'chore/open-source-readiness^{tree}')" != "$workflow_tree_before" ]]; then
            echo "::error::readiness branch tree changed during message-only rewrite"
            exit 1
          fi

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin || true

          # Remove this temporary workflow from the final branch state so it cannot rerun.
          git switch chore/open-source-readiness
          git rm .github/workflows/history-cleanup.yml
          git commit -m "chore: remove temporary history cleanup workflow"

          if [[ "$(git rev-parse 'HEAD^{tree}')" != "$readiness_target_tree" ]]; then
            echo "::error::Final readiness tree does not match the pre-workflow tree"
            exit 1
          fi

          if git log main chore/open-source-readiness --format='%B' | grep -q '^Claude-Session:'; then
            echo "::error::Claude-Session line reachable from final branches"
            exit 1
          fi

          push_specs=(
            '+main:refs/heads/main'
            '+chore/open-source-readiness:refs/heads/chore/open-source-readiness'
          )
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            push_specs+=("+refs/tags/$tag:refs/tags/$tag")
          done < <(git tag --list | sort)

          # Branches and tags move together or not at all.
          git push --atomic origin "${push_specs[@]}"

          echo "History cleanup completed."
          echo "New main: $(git rev-parse main)"
          echo "New readiness: $(git rev-parse chore/open-source-readiness)"
