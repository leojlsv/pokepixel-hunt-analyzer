name: Prepare v1.11 docs

on:
  push:
    branches:
      - feature/tampermonkey-native-updates

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Finalize release documentation
        run: node scripts/finalize-v1.11-docs.mjs
      - name: Commit documentation and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-v1.11-docs.yml scripts/finalize-v1.11-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DEVELOPMENT.md CHANGELOG.md
          git commit -m "docs: finalize v1.11.0 update and release guidance"
          git push origin HEAD:feature/tampermonkey-native-updates
